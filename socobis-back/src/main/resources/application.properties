spring.application.name=socobis-back

# Oracle datasource (defaults for local docker-compose mapping)
# Can be overridden with environment variables: APJ_CONNECTION_URL / APJ_CONNECTION_USER / APJ_CONNECTION_PASSWORD
spring.datasource.url=${APJ_CONNECTION_URL:jdbc:oracle:thin:@//localhost:1521/EE.oracle.docker}
spring.datasource.username=${APJ_CONNECTION_USER:socobis}
spring.datasource.password=${APJ_CONNECTION_PASSWORD:socobis}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

server.port=8090